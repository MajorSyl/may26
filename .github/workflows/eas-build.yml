name: EAS Preview Build

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'mobile-rn/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Link EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --non-interactive --force

      # Publishes an EAS Update (OTA) to the "preview" channel on every
      # push -- this is what lets already-installed apps pick up JS/logic/
      # copy changes without a reinstall (see app.json's runtimeVersion/
      # updates config). Runs before, and independent of, the native
      # build step below, so a JS-only fix still reaches devices even if
      # the native build is blocked (e.g. by the EAS free-tier build
      # quota) -- only a genuinely new native dependency/permission needs
      # that slower path.
      - name: Publish OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --branch preview --environment preview --message "Auto-publish from CI (run #${{ github.run_number }}, ${{ github.sha }})" --non-interactive

      # iOS builds need real Apple Developer Program credentials (a paid
      # account + Apple ID), which EAS can't generate non-interactively the
      # way it auto-generates an Android keystore. Building Android only
      # here until iOS credentials are set up once via `eas credentials`
      # (interactive) with an actual Apple Developer account.
      - name: Build (Android, internal distribution)
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          eas build --profile preview --platform android --non-interactive --json > build-result.json
          BUILD_EXIT=$?
          set -e
          echo "----- eas build --json output -----"
          cat build-result.json || echo "(no output captured)"
          echo "------------------------------------"
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "eas build exited with code $BUILD_EXIT"
            exit "$BUILD_EXIT"
          fi
          BUILD_URL=$(node -e "const r=require('./build-result.json'); const b=Array.isArray(r)?r[0]:r; console.log(b.artifacts.buildUrl)")
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      # EAS's own artifact URL is a signed CDN link that isn't guaranteed to
      # stay valid indefinitely -- download it into the runner and re-host
      # it as a GitHub Release asset instead, which is a permanent, public,
      # no-login-required URL (unlike a GitHub Actions artifact, which
      # requires a GitHub login and expires after 90 days).
      - name: Download APK from EAS
        run: curl -L --fail -o rcfs.apk "${{ steps.eas_build.outputs.build_url }}"

      # appVersionSource=remote (eas.json) means EAS's own servers -- not
      # this checkout's app.json -- are the source of truth for
      # versionCode, and increment it on every build (autoIncrement: true
      # on the preview profile). That's what actually makes each APK a
      # real Android "update" over the last one; a CI runner has no
      # durable state between runs, so incrementing a value inside the
      # repo alone would just reset to the same number every build. This
      # reads back the number EAS actually assigned so the website's
      # update-check can compare against it.
      - name: Read assigned versionCode
        id: version_info
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:version:get --platform android --non-interactive --json > version-info.json || echo '{}' > version-info.json
          cat version-info.json
          VERSION_CODE=$(node -e "try { const v=require('./version-info.json'); console.log(v.android?.versionCode ?? v.versionCode ?? ''); } catch { console.log(''); }")
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('fs');
            const app = require('./app.json').expo;
            fs.writeFileSync('version.json', JSON.stringify({
              versionName: app.version,
              versionCode: '$VERSION_CODE' ? parseInt('$VERSION_CODE', 10) : null,
              apkUrl: 'https://github.com/${{ github.repository }}/releases/download/android-latest/rcfs.apk',
              buildNumber: ${{ github.run_number }}
            }, null, 2));
          "
          cat version.json

      # Publishes to a single stable tag (android-latest) rather than a new
      # tag per build, so the download link embedded in the app/website
      # never has to change -- each successful build just replaces the
      # asset behind the same permanent URL.
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "RCFS Android Preview (build #${{ github.run_number }}, versionCode ${{ steps.version_info.outputs.version_code }})"
          body: |
            Automatically published by the EAS Preview Build workflow.
            Always available at the same URL -- this release is updated in place on every successful build, not created fresh each time.
          files: |
            mobile-rn/rcfs.apk
            mobile-rn/version.json
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
